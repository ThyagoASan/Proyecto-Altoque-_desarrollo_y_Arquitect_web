<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Perfil del Prestador</title>
        <link rel="stylesheet" href="css.css" />
        <link
            href="https://fonts.googleapis.com/icon?family=Material+Icons"
            rel="stylesheet"
        />
    </head>
    <body class="a">
        <section class="perfil">
            <div class="perfil-card">
                <div class="informacion_card">
                    <div class="perfil-foto">
                        <img src="imagenes/usuario.avif" alt="" />
                        <span class="text_disponible">
                            <span class="material-icons"> circle </span>
                            Disponible</span
                        >
                    </div>
                    <div class="informacion_basica-perfil">
                        <h2 id="perfil-nombre">Nombre del prestador</h2>

                        <div>
                            <span class="text_info">
                                <span class="material-icons icono_perfil">
                                    home_repair_service
                                </span>
                                Oficio:</span
                            >
                            <span id="perfil-oficio"></span>
                        </div>
                        <div>
                            <span class="text_info">
                                <span class="material-icons icono_perfil">
                                    location_on</span
                                >
                                Zona:</span
                            >
                            <span id="perfil-zona"></span>
                        </div>
                        <div>
                            <span class="text_info">
                                <span class="material-icons icono_perfil"
                                    >star</span
                                >
                                Calificación:</span
                            >
                            <span id="perfil-estrellas"></span>
                        </div>
                    </div>
                </div>

                <div class="descripcion_div">
                    <strong> Descripción:</strong>
                    <p class="perfil-descripcion" id="perfil-descripcion">
                        Descripción del servicio.
                    </p>
                </div>
                <div class="div_botones">
                    <button class="botones-perfil btm_volver" type="button">
                        <span class="material-icons icono_perfil"
                            >chevron_left
                        </span>
                        <a class="inicio-link" href="pagina1.html">Volver</a>
                    </button>

                    <button
                        class="botones-perfil"
                        type="button"
                        id="btn-contratar"
                    >
                        <span
                            class="material-icons icono_perfil icono_contratar"
                            >handshake</span
                        >
                        Contratar
                    </button>
                </div>
            </div>
        </section>

        <script src="script.js"></script>
    </body>
</html>
